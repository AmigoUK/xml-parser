x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Zmienne wspólne dla app i worker (wartości z .env przez interpolację) — bez MARIADB_ROOT_PASSWORD i reszty sekretów
# usługi db. Nowa zmienna aplikacji = nowy wiersz tutaj; brak w .env daje bezpieczną wartość domyślną.
x-app-env: &app-env
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY w .env}
      DATABASE_URL: ${DATABASE_URL:?Ustaw DATABASE_URL w .env}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-10485760}
      MAX_TREE_NODES: ${MAX_TREE_NODES:-200000}
      MAX_LINES: ${MAX_LINES:-5000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-0}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-http}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      LOGIN_MAX_ATTEMPTS_PER_IP: ${LOGIN_MAX_ATTEMPTS_PER_IP:-20}
      LOGIN_MAX_ATTEMPTS_PER_EMAIL: ${LOGIN_MAX_ATTEMPTS_PER_EMAIL:-50}
      LOGIN_EMAIL_LOCKOUT_MINUTES: ${LOGIN_EMAIL_LOCKOUT_MINUTES:-5}
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Warsaw}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      APP_INTERNAL_PORT: ${APP_INTERNAL_PORT:-5010}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-1}
      MIGRATE_LOCK_TIMEOUT: ${MIGRATE_LOCK_TIMEOUT:-600}
      DB_WAIT_ATTEMPTS: ${DB_WAIT_ATTEMPTS:-10}
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_WORKER_TMP_DIR: ${GUNICORN_WORKER_TMP_DIR:-/dev/shm}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-0}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-30}
      WEBHOOK_HEARTBEAT_FILE: ${WEBHOOK_HEARTBEAT_FILE:-}

services:
  db:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Ustaw MARIADB_ROOT_PASSWORD w .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-xmlparser}
      MARIADB_USER: ${MARIADB_USER:-xmlparser}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Ustaw MARIADB_PASSWORD w .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [dbdata:/var/lib/mysql]
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    logging: *logging
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
  app:
    build: .
    image: xml-parser:local
    restart: unless-stopped
    # Tylko zmienne aplikacji (kotwica x-app-env na górze pliku), bez sekretów usługi db.
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    ports:
      # Domyślnie tylko localhost. Dla dostępu przez Tailscale ustaw APP_BIND=<IP tailscale0>.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-18506}:${APP_INTERNAL_PORT:-5010}"
    volumes: [storage:/data/storage]
    mem_limit: ${APP_MEM_LIMIT:-1g}
    cpus: ${APP_CPUS:-2.0}
    logging: *logging
    # sonda zdrowia: HEALTHCHECK z obrazu (Dockerfile) — /healthz na porcie aplikacji
  # Worker webhooków: dostarcza powiadomienia z kolejki (flask webhooks-worker). Bez portów; migracje robi app.
  # Awaryjnie, gdy worker nie działa: flask webhooks-worker --once z crona.
  worker:
    # ten sam obraz co app (budowany raz przez usługę app; `up -d --build` buduje go przed startem workera)
    image: xml-parser:local
    stop_grace_period: 30s
    restart: unless-stopped
    command: ["flask", "webhooks-worker"]
    environment:
      <<: *app-env
      MIGRATE_ON_START: "0"
      WEBHOOK_HEARTBEAT_FILE: /data/storage/worker-heartbeat
    depends_on:
      app: { condition: service_healthy }
    volumes: [storage:/data/storage]
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1.0}
    logging: *logging
    # nadpisuje sondę HTTP z obrazu: heartbeat workera nie starszy niż 60 s
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y \"$$WEBHOOK_HEARTBEAT_FILE\") )) -lt 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  dbdata:
  storage:
networks:
  default:
    ipam:
      config:
        - subnet: ${XP_SUBNET:-10.210.10.0/24}
