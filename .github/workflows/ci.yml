name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"  # ta sama wersja co obraz python:3.12.15-slim-trixie (Dockerfile)
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      # te same piny co w obrazie (requirements.lock) + narzędzia deweloperskie; pip check wykrywa niespójne wersje
      - run: pip install -r requirements.lock -r requirements-dev.txt && pip check
      - name: Lint (ruff — konfiguracja w pyproject.toml)
        run: ruff check .
      - name: Znane podatności zależności runtime (requirements.lock)
        run: pip-audit -r requirements.lock --strict --progress-spinner off
      - name: MariaDB testowa (tymczasowy kontener, jak w docker-compose.yml)
        run: |
          docker run -d --name mariadb-test -e MARIADB_ROOT_PASSWORD=ci-root -e MARIADB_DATABASE=xp_test \
            -p 127.0.0.1:3306:3306 mariadb:11.4.13 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 60); do
            docker exec mariadb-test healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "MariaDB nie wystartowała w 60 s" >&2
          docker logs mariadb-test >&2
          exit 1
      # pokrycie liniowe app/ — próg poniżej bieżącego wyniku (93 %), żeby wychwycić dopisanie kodu bez testów
      - run: pytest -q -rs --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
        env:
          TEST_MARIADB_URL: mysql+pymysql://root:ci-root@127.0.0.1:3306/xp_test?charset=utf8mb4

  no-private-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Brak private/ i .env w repozytorium
        run: |
          bad=$(git ls-files | grep -E '^(private/|\.env$|\.env\.[^e]|\.env\.(local|prod|production)$)' || true)
          if [ -n "$bad" ]; then
            echo "Zabronione pliki w repozytorium:" >&2
            echo "$bad" >&2
            exit 1
          fi
