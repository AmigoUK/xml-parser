{% extends "base.html" %}
{% block title %}Zmiana hasła{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h4 mb-3">Zmiana hasła</h1>
  <p class="small text-muted">Hasło: co najmniej 10 znaków, nie przykładowe. Po zmianie pozostałe sesje tego konta
    (inne przeglądarki, skopiowane ciasteczka) zostaną wylogowane.</p>
  <form method="post" class="card card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Obecne hasło <input class="form-control" type="password" name="current_password" required autocomplete="current-password" autofocus></label>
    <label class="form-label">Nowe hasło <input class="form-control" type="password" name="new_password" required minlength="10" autocomplete="new-password"></label>
    <label class="form-label">Powtórz nowe hasło <input class="form-control" type="password" name="new_password2" required minlength="10" autocomplete="new-password"></label>
    <button class="btn btn-primary">Zmień hasło</button>
  </form>
</div></div>
{% endblock %}
