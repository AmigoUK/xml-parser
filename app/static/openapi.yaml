openapi: 3.0.3
info:
  title: XML Parser faktur — API
  version: "1"
  description: |
    Wysyłasz fakturę (XML / JSON / CSV), dostajesz znormalizowany JSON.
    Status `needs_review` oznacza, że operator musi rozwiązać problemy w panelu,
    a `approved` — że faktura została odczytana automatycznie.

    Dokumenty są ograniczone do klucza API: widzisz, pobierasz i przetwarzasz ponownie
    tylko dokumenty wysłane tym samym kluczem (cudze zwracają 404).

    **Czas:** w odpowiedziach (`created_at`, `updated_at`) zawsze ISO 8601 w UTC z mikrosekundami
    i `Z`, np. `2026-10-11T06:04:38.312308Z`. Parametry czasu (`since`, `updated_since`) przyjmują
    strefę (`+02:00`, `Z` — przeliczaną na UTC); czas bez strefy oznacza UTC, a sama data
    (`2026-10-11`) — północ UTC. Znak `+` w adresie URL zapisz jako `%2B`.

    **Synchronizacja zmian statusów:** `GET /documents?updated_since=…&status=approved&limit=500`,
    a kolejne strony z tymi samymi parametrami i `cursor=<next_cursor>`, aż `next_cursor` = `null`.
    Opis algorytmu: Pomoc → „Integracja z własną aplikacją”.
servers: [{ url: /api/v1 }]
security: [{ ApiKey: [] }]
components:
  securitySchemes:
    ApiKey: { type: apiKey, in: header, name: X-API-Key }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: bad_request }
            message: { type: string }
    Issue:
      type: object
      properties:
        code: { type: string, example: unknown_unit }
        severity: { type: string, enum: [blocking, warning] }
        message: { type: string }
        field: { type: string, nullable: true }
        line_no: { type: integer, nullable: true }
        source_path: { type: string, nullable: true }
        source_value: { type: string, nullable: true }
        suggestions: { type: array, items: { type: object } }
        count:
          type: integer
          minimum: 1
          default: 1
          description: Liczba pozycji, których dotyczy problem (problemy pozycji są agregowane).
        line_nos:
          type: array
          items: { type: integer }
          maxItems: 20
          description: Pierwsze numery pozycji objętych problemem (maks. 20).
    InvoiceLine:
      type: object
      description: Pozycja dokumentu kanonicznego. Kwoty i ilości jako stringi z kropką dziesiętną.
      properties:
        line_no: { type: integer }
        supplier_code: { type: string, nullable: true }
        gtin: { type: string, nullable: true }
        name: { type: string, nullable: true }
        qty: { type: string, nullable: true, example: "2" }
        unit: { type: string, nullable: true, example: szt }
        unit_source: { type: string, nullable: true }
        unit_price_net: { type: string, nullable: true, example: "10.0000" }
        net: { type: string, nullable: true, example: "20.00" }
        vat_rate:
          nullable: true
          description: Stawka VAT w procentach jako liczba-tekst (np. "23", "8", "0") albo kod
            zwolnienia/wyłączenia — "zw" (zwolniona), "np" (nie podlega), "oo" (odwrotne obciążenie).
          oneOf:
            - { type: string, pattern: '^-?\d+(\.\d+)?$', example: "23" }
            - { type: string, enum: [zw, np, oo] }
        vat: { type: string, nullable: true }
        gross: { type: string, nullable: true }
        batch: { type: string, nullable: true }
        expiry_date: { type: string, format: date, nullable: true }
        product_index: { type: string, nullable: true, description: Indeks towaru z naszej kartoteki }
        conversion_factor: { type: string, example: "1" }
    Invoice:
      type: object
      description: Dokument kanoniczny (kwoty jako stringi).
      properties:
        doc_type: { type: string, example: invoice }
        number: { type: string, nullable: true }
        issue_date: { type: string, format: date, nullable: true }
        currency: { type: string, nullable: true, example: PLN }
        supplier: { type: object }
        buyer: { type: object }
        totals: { type: object }
        lines: { type: array, items: { $ref: "#/components/schemas/InvoiceLine" } }
      additionalProperties: true
    DocumentSummary:
      type: object
      description: Dokument bez wyniku i problemów — pozycja listy `GET /documents`.
      properties:
        id: { type: integer, example: 2 }
        status: { type: string, enum: [received, approved, needs_review, duplicate, rejected], example: approved }
        status_label: { type: string, example: Zatwierdzona }
        format: { type: string, enum: [xml, json, csv], nullable: true, example: xml }
        filename: { type: string, nullable: true, example: alfa-2.xml }
        number: { type: string, nullable: true, example: FA/2026/10/002 }
        issue_date: { type: string, format: date, nullable: true, example: "2026-10-10" }
        doc_type: { type: string, nullable: true, example: invoice }
        supplier:
          type: object
          nullable: true
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: Hurtownia Alfa Sp. z o.o. }
        template_version: { type: integer, nullable: true, example: 2 }
        created_at:
          type: string
          format: date-time
          example: "2026-10-11T06:04:38.312308Z"
          description: Chwila przyjęcia dokumentu (UTC, mikrosekundy, `Z`) — po niej filtruje `since`.
        updated_at:
          type: string
          format: date-time
          example: "2026-10-11T06:04:38.412811Z"
          description: |
            Chwila ostatniej zmiany statusu lub wyniku (UTC, mikrosekundy, `Z`) — po niej filtruje
            `updated_since`. Zmienia ją każde przetworzenie (przyjęcie, decyzja operatora w panelu,
            „Przetwórz ponownie”, `reprocess`) — także gdy wynik wyszedł taki sam — oraz „Odrzuć”
            i „Przywróć” w panelu. Samo pobranie dokumentu jej nie zmienia.
        issues_count: { type: integer, example: 0 }
    Document:
      description: Dokument z wynikiem kanonicznym (`invoice`) i listą problemów (`issues`).
      allOf:
        - { $ref: "#/components/schemas/DocumentSummary" }
        - type: object
          properties:
            invoice: { allOf: [{ $ref: "#/components/schemas/Invoice" }], nullable: true }
            issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
    DocumentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DocumentSummary" } }
        next_cursor:
          type: string
          nullable: true
          example: MjAyNi0xMC0xMVQwNjowNDozOC4zMTIzMDh8Nw
          description: |
            Tylko w trybie synchronizacji (żądanie z `updated_since` lub `cursor`) — w trybie zwykłym
            pola nie ma. Nieprzezroczysty token pozycji ostatniego zwróconego dokumentu: kolejną stronę
            pobierasz z tymi samymi `status`, `since`, `updated_since` i `limit` oraz `cursor=<next_cursor>`.
            `null` = to ostatnia strona.
paths:
  /documents:
    post:
      summary: Wyślij fakturę
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
          application/xml: { schema: { type: string } }
          application/json: { schema: { type: object } }
          text/csv: { schema: { type: string } }
      responses:
        "201": { description: Przyjęto, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "400": { description: Pusty plik, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Brak klucza API }
        "413": { description: Plik za duży }
    get:
      summary: Lista dokumentów i synchronizacja zmian
      description: |
        **Tryb zwykły** (bez `updated_since` i `cursor`): od najnowszych (malejąco po `id`), odpowiedź
        `{"items": [...]}` bez `next_cursor`, bez stronicowania.

        **Tryb synchronizacji** (z `updated_since` lub `cursor`): dokumenty o `updated_at` ≥ `updated_since`,
        rosnąco po (`updated_at`, `id`), odpowiedź `{"items": [...], "next_cursor": "…" | null}`. Dostawa
        „co najmniej raz”: dokument zmieniony w trakcie stronicowania wraca na dalszej stronie z nowym
        `updated_at`, a dokument z `updated_at` równym `updated_since` wraca w kolejnym przebiegu —
        odrzucaj powtórzenia po `id` i `updated_at`.

        `status` i `since` działają w obu trybach (łączone warunkiem „i”). Pusty parametr (np. `updated_since=`)
        oznacza brak parametru.
      parameters:
        - name: status
          in: query
          description: Tylko dokumenty w tym statusie.
          schema: { type: string, enum: [received, approved, needs_review, duplicate, rejected] }
        - name: since
          in: query
          description: |
            Dokumenty **przyjęte** (`created_at`) w tej chwili lub później. Filtruje po czasie przyjęcia,
            więc nie widzi późniejszych zmian statusu — do synchronizacji używaj `updated_since`.
          schema: { type: string, format: date-time, example: "2026-10-01T00:00:00Z" }
        - name: updated_since
          in: query
          description: |
            Włącza tryb synchronizacji: dokumenty zmienione (`updated_at`) w tej chwili lub później.
            Pełna synchronizacja od początku: `1970-01-01T00:00:00Z`.
          schema: { type: string, format: date-time, example: "2026-10-11T06:00:00Z" }
        - name: cursor
          in: query
          description: |
            Kolejna strona trybu synchronizacji: wartość `next_cursor` z poprzedniej odpowiedzi (sam `cursor`
            też włącza ten tryb). Kursor niesie tylko pozycję — powtórz pozostałe parametry; zakres zawsze
            wyznacza klucz API z nagłówka.
          schema: { type: string }
        - name: limit
          in: query
          description: Liczba wyników (na stronę) — większe wartości są obcinane do 500, mniejsze od 1 podnoszone do 1.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Dokumenty klucza API (bez `invoice` i `issues`).
          content: { application/json: { schema: { $ref: "#/components/schemas/DocumentList" } } }
        "400":
          description: Zły parametr (`status`, `since`, `updated_since`, `limit`) albo uszkodzony `cursor` — kod `bad_request`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { description: Brak klucza API }
  /documents/{id}:
    get:
      summary: Szczegóły dokumentu
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "404": { description: Nie znaleziono }
  /documents/{id}/reprocess:
    post:
      summary: Przetwórz ponownie aktywną wersją szablonu
      description: |
        Dokument odrzucony ręcznie przez operatora pozostaje odrzucony — zwracamy 409 (`rejected`);
        przywrócić go można tylko w panelu. Odrzucenia automatyczne (plik nieczytelny, zbyt wiele
        pozycji) można przetworzyć ponownie.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "404": { description: Nie znaleziono }
        "409": { description: Dokument odrzucony przez operatora, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /suppliers:
    get:
      summary: Lista dostawców
      responses: { "200": { description: OK } }
